</head>
<body>
  <script>
    // Android in-app browsers cannot transfer an in-memory PNG to Chrome.
    // They pass the small result route instead; restore it before Flutter
    // starts so Chrome can recreate the same card for a real download tap.
    (() => {
      const params = new URLSearchParams(window.location.search);
      const handoff = params.get('handoff');
      if (handoff && handoff.startsWith('/')) {
        const clean = new URL(window.location.href);
        clean.search = '';
        clean.hash = handoff;
        window.history.replaceState(null, '', clean);
      }
    })();
  </script>

</body>
